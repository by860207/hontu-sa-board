<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<title>虛擬幣走勢圖(秒級)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root{--bg:#131722;--panel:#1c2230;--panel2:#252d40;--bd:#2a3245;--ink:#e6e9f0;--ink2:#9aa3b5;
        --up:#ef5350;--dn:#26a69a;--acc:#f0b429;--warn:#ffb74d}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI","Microsoft JhengHei",sans-serif;padding:6px}
  .hdr{display:flex;gap:8px;align-items:baseline;padding:2px 8px 6px;flex-wrap:wrap}
  .hdr .px{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .hdr .s{font-size:12px;color:var(--ink2)}
  .hdr a{color:#2bb0ed;font-size:12px;text-decoration:none;margin-left:auto}
  .symbtn{background:#252d40;color:var(--ink2);border:1px solid #2a3245;border-radius:5px;
          padding:2px 10px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:700}
  .symbtn.on{background:var(--acc);color:#0b1320;border-color:var(--acc)}
  .bar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;background:var(--panel);
       border-radius:6px;padding:1px 6px;margin-bottom:1px}
  .tfbtn{background:#252d40;color:var(--ink2);border:1px solid #2a3245;border-radius:5px;
         padding:1px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  .tfbtn.on{background:#2bb0ed;color:#0b1320;font-weight:700;border-color:#2bb0ed}
  .bar label{font-size:11px;color:var(--ink2);margin-left:4px}
  .bar input[type=number]{width:42px;background:#252d40;color:var(--ink);border:1px solid #2a3245;
       border-radius:4px;padding:1px 3px;font-size:12px;font-family:inherit}
  .bar input[type=range]{width:70px;accent-color:#2bb0ed}
  .chart{width:100%}
  .up{color:var(--up)}.dn{color:var(--dn)}
  #dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;vertical-align:0}
  #dot.ok{background:#26a69a}#dot.bad{background:#ef5350}

  /* ═ 浮動下單框 ═ */
  .float{position:fixed;width:236px;background:rgba(28,34,48,.97);border:1px solid #38415a;
         border-radius:10px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:12px}
  .fhead{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--bd);
         cursor:grab;touch-action:none;user-select:none}
  .fhead .grip{color:#5c6478;font-size:13px;letter-spacing:-1px}
  .fhead .ft{font-weight:700;font-size:12.5px}
  .fhead .ft small{color:var(--ink2);font-weight:400;margin-left:3px}
  .fhead .hb{margin-left:auto;display:flex;gap:2px}
  .fhead button{background:none;border:0;color:var(--ink2);font-size:14px;cursor:pointer;padding:0 5px}
  .fbody{padding:8px 10px 10px}
  .oseg{display:flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden;margin-bottom:8px}
  .oseg button{flex:1;background:var(--panel2);border:0;color:var(--ink2);padding:6px;font:700 12.5px inherit;cursor:pointer}
  .oseg button.on-long{background:var(--up);color:#fff}
  .oseg button.on-short{background:var(--dn);color:#fff}
  .sld{margin-bottom:6px}
  .sld .top{display:flex;justify-content:space-between;align-items:baseline}
  .sld .top label{font-size:10.5px;color:var(--ink2)}
  .sld .top b{font-size:13px;font-variant-numeric:tabular-nums}
  .sld input[type=range]{width:100%;height:20px;accent-color:var(--acc);cursor:pointer;touch-action:none}
  .est{font-size:11px;color:var(--ink2);display:flex;justify-content:space-between;
       font-variant-numeric:tabular-nums;line-height:1.65}
  .est b{color:var(--ink)}
  .warnline{font-size:10.5px;color:var(--warn);margin-top:2px;line-height:1.5}
  .send{width:100%;border:0;border-radius:7px;color:#fff;font:700 13.5px inherit;padding:9px;cursor:pointer;margin-top:7px}
  .send.long{background:var(--up)}.send.short{background:var(--dn)}
  .send:disabled{opacity:.45}
  .posrow{margin-top:8px;border-top:1px dashed var(--bd);padding-top:7px;display:none;
          align-items:center;gap:6px;font-size:11.5px;flex-wrap:wrap}
  .posrow.on{display:flex}
  .posrow .flat{margin-left:auto;background:var(--panel2);border:1px solid var(--bd);color:var(--ink);
                border-radius:6px;padding:5px 10px;font:12px inherit;cursor:pointer}
  .pnl{font-variant-numeric:tabular-nums}
  .float.min .fbody{display:none}
  .rsz{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;
       touch-action:none;color:#5c6478;font-size:12px;display:flex;align-items:flex-end;
       justify-content:flex-end;padding:0 3px 1px 0;user-select:none}
  .float.min .rsz{display:none}
  .pill{position:fixed;right:12px;bottom:14px;z-index:50;background:var(--acc);color:#0b1320;
        border:0;border-radius:99px;padding:9px 16px;font:700 13px inherit;cursor:pointer;
        box-shadow:0 6px 18px rgba(0,0,0,.5);display:none}
  .pill.on{display:block}
  .setf{background:var(--panel2);border:1px solid var(--bd);border-radius:7px;padding:6px 9px;margin-bottom:7px}
  .setf label{font-size:10px;color:var(--ink2);display:block}
  .setf input{width:100%;background:none;border:0;color:var(--ink);font:600 13px inherit;outline:none}
  .note{font-size:10.5px;color:var(--ink2);line-height:1.55;margin:6px 0}
  .note b{color:var(--warn)}
  .ghost{background:none;border:1px solid var(--bd);color:var(--ink2);border-radius:6px;
         padding:5px 10px;font:11.5px inherit;cursor:pointer}
  .confirm{position:fixed;inset:0;background:rgba(11,14,21,.93);z-index:60;display:none;
           flex-direction:column;justify-content:center;padding:26px}
  .confirm.open{display:flex}
  .ccard{max-width:360px;margin:0 auto;width:100%;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:18px}
  .ccard h3{font-size:16px;margin-bottom:12px}
  .crow{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;
        border-bottom:1px dashed #232a3c;font-variant-numeric:tabular-nums}
  .crow:last-of-type{border:0}
  .crow .k{color:var(--ink2)}
  .okbtn{margin-top:14px;width:100%;padding:13px;font-size:15px;border:0;border-radius:7px;
         color:#fff;font-weight:700;cursor:pointer}
  .okbtn.long{background:var(--up)}.okbtn.short{background:var(--dn)}.okbtn.flatc{background:#33405c}
  .cancel{margin-top:8px;width:100%;background:none;border:1px solid var(--bd);color:var(--ink2);
          border-radius:7px;padding:10px;cursor:pointer;font:14px inherit}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1d3a2c;color:#7fe0b8;
         border:1px solid #2d5c44;border-radius:8px;padding:8px 18px;font-size:13px;z-index:70;display:none;
         white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  .toast.err{background:#3a1d1d;color:#ffb3b3;border-color:#5c2d2d}
</style></head><body>
<div class="hdr">
  <span id="syms"></span>
  <span class="px" id="px">--</span>
  <span class="s"><span id="chg">--</span> 24h</span>
  <span class="s">高 <span id="hi">--</span> 低 <span id="lo">--</span></span>
  <span class="s"><span id="dot"></span> <span id="ts">連線中…</span></span>
  <a href="index.html">← 訊號看板</a>
</div>
<div id="panels"></div>

<!-- ═ 浮動下單框 (OKX永續·市價) ═ -->
<div class="float" id="fl" style="right:10px;bottom:14px" hidden>
  <div class="fhead" id="fhead">
    <span class="grip">⠿</span><span class="ft" id="fTitle">BTC-USDT<small>OKX永續·市價</small></span>
    <span class="hb"><button id="setBtn" title="金鑰設定">⚙</button><button id="minBtn" title="收合">—</button><button id="hideBtn" title="關閉">✕</button></span>
  </div>
  <div class="fbody" id="tradeBody">
    <div class="oseg"><button id="oLong" class="on-long">做多</button><button id="oShort">做空</button></div>
    <div class="sld">
      <div class="top"><label id="levLab">槓桿</label><b id="levV" style="color:var(--acc)">5x</b></div>
      <input type="range" id="lev" min="1" max="100" step="1" value="5">
    </div>
    <div class="sld">
      <div class="top"><label>倉位（可用×槓桿）</label><b id="pctV">20%</b></div>
      <input type="range" id="pct" min="0" max="100" step="1" value="20">
    </div>
    <div class="est"><span>可用 <b id="estAvail">--</b></span><span>名目 <b id="estNot">--</b></span></div>
    <div class="est"><span>≈ <b id="estCoin">--</b></span><span>保證金 <b id="estMar">--</b></span></div>
    <div class="warnline" id="ordWarn" hidden></div>
    <button class="send long" id="sendBtn">市價買入</button>
    <div class="posrow" id="posRow">
      <b id="posTxt">--</b><span class="pnl" id="posPnl"></span><span class="s" id="posSub"></span>
      <button class="flat" id="flatBtn">市價平倉</button>
    </div>
  </div>
  <div class="fbody" id="setBody" hidden>
    <div class="setf"><label>OKX API Key</label><input id="ck" autocomplete="off"></div>
    <div class="setf"><label>Secret Key</label><input id="cs" type="password" autocomplete="off"></div>
    <div class="setf"><label>Passphrase 密碼短語</label><input id="cp" type="password" autocomplete="off"></div>
    <div class="note"><b>只存這台裝置的瀏覽器</b>，不上傳任何伺服器。請確認這把金鑰<b>沒有提現權限</b>。全倉模式、市價單。</div>
    <button class="send long" id="saveCred" style="background:#33405c">儲存金鑰</button>
    <button class="ghost" id="clearCred" style="margin-top:6px;width:100%">清除金鑰</button>
  </div>
  <div class="rsz" id="rsz" title="拖曳縮放">◢</div>
</div>
<button class="pill" id="pill">下單</button>

<div class="confirm" id="confirm">
  <div class="ccard">
    <h3 id="cTitle">確認市價下單</h3>
    <div id="cRows"></div>
    <button class="okbtn long" id="okBtn">確認送出</button>
    <button class="cancel" id="cCancel">取消</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ═ 虛擬幣秒級看盤 v2 (2026-09-09) ═
// 行情三層自動切換: 幣安WS → OKX WS → REST輪詢(當前源)。下單: OKX永續 市價/全倉。
// 金鑰只存瀏覽器localStorage, 絕不進repo。
const SYMS=[
  {s:'BTCUSDT',n:'BTC',dp:1,inst:'BTC-USDT-SWAP'},
  {s:'ETHUSDT',n:'ETH',dp:2,inst:'ETH-USDT-SWAP'},
  {s:'SOLUSDT',n:'SOL',dp:2,inst:'SOL-USDT-SWAP'}];
const TFS=[{tf:1,iv:'1m',ob:'1m'},{tf:5,iv:'5m',ob:'5m'},{tf:15,iv:'15m',ob:'15m'},{tf:60,iv:'1h',ob:'1H'}];
const REST_BN='https://fapi.binance.com/fapi/v1/klines';
const OKX='https://www.okx.com';
const css=getComputedStyle(document.documentElement);
const C={up:css.getPropertyValue('--up').trim(),dn:css.getPropertyValue('--dn').trim(),
         ink:css.getPropertyValue('--ink').trim(),ink2:css.getPropertyValue('--ink2').trim()};
const MACOLOR=['#f0b429','#2bb0ed','#c678dd','#ff8a5c'];
let SYM=SYMS[0];
let PANELS=[{tf:1,ma:[5,10,20,60],volh:12},{tf:15,ma:[5,10,20,60],volh:12}];
try{const sv=JSON.parse(localStorage.getItem('crypto_panels'));
    if(sv&&Array.isArray(sv.p)&&sv.p.length===2){PANELS=PANELS.map((p,i)=>Object.assign(p,sv.p[i]));
      const s2=SYMS.find(x=>x.s===sv.sym);if(s2)SYM=s2;}}catch(e){}
function save(){try{localStorage.setItem('crypto_panels',JSON.stringify(
  {sym:SYM.s,p:PANELS.map(p=>({tf:p.tf,ma:p.ma,volh:p.volh}))}));}catch(e){}}

const CACHE={};
const ckey=tf=>SYM.s+'_'+tf;
const tfDef=tf=>TFS.find(x=>x.tf===tf);
const fmt=v=>v==null?'--':(+v).toLocaleString(undefined,{minimumFractionDigits:SYM.dp,maximumFractionDigits:SYM.dp});
function pad(n){return (n<10?'0':'')+n;}
function lbl(ts){const d=new Date(ts*1000);
  return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}

// ═══ 行情資料層: SRC='bn'(幣安)|'okx' ═══
let SRC='bn';
async function loadTF(tf){
  const k=ckey(tf),d={labels:[],ohlc:[],vol:[],ts:[]};
  if(SRC==='bn'){
    const lim=tf===1?1500:1000;
    const r=await fetch(REST_BN+'?symbol='+SYM.s+'&interval='+tfDef(tf).iv+'&limit='+lim);
    if(!r.ok)throw new Error('bn '+r.status);
    for(const b of await r.json()){const t0=b[0]/1000;
      d.ts.push(t0);d.labels.push(lbl(t0));
      d.ohlc.push([+b[1],+b[4],+b[3],+b[2]]);d.vol.push(+(+b[5]).toFixed(1));}
  }else{
    // OKX: 最新在前, after往回翻3頁≈900根
    let rows=[],after='';
    for(let pg=0;pg<3;pg++){
      const r=await fetch(OKX+'/api/v5/market/candles?instId='+SYM.inst+'&bar='+tfDef(tf).ob+'&limit=300'+after);
      if(!r.ok)break;
      const j=await r.json();
      if(j.code!=='0'||!j.data.length)break;
      rows=rows.concat(j.data);
      after='&after='+j.data[j.data.length-1][0];
    }
    rows.reverse();
    for(const b of rows){const t0=+b[0]/1000;
      d.ts.push(t0);d.labels.push(lbl(t0));
      d.ohlc.push([+b[1],+b[4],+b[3],+b[2]]);d.vol.push(+(+b[5]).toFixed(1));}
  }
  CACHE[k]=d;barTick=Date.now();return d;
}
let barTick=0;   // K棒最後更新時刻(WS或REST); 價格在跳但K棒卡住→REST保底靠這個判斷
function applyK(tf,k){
  barTick=Date.now();
  const d=CACHE[ckey(tf)];if(!d)return;
  const t0=k.t/1000;
  const bar=[+k.o,+k.c,+k.l,+k.h],v=+(+k.v).toFixed(1);
  const last=d.ts.length-1;
  if(last>=0&&d.ts[last]===t0){d.ohlc[last]=bar;d.vol[last]=v;}
  else if(last<0||t0>d.ts[last]){
    d.ts.push(t0);d.labels.push(lbl(t0));d.ohlc.push(bar);d.vol.push(v);
    if(d.ts.length>2200){d.ts.shift();d.labels.shift();d.ohlc.shift();d.vol.shift();}
  }
}

// ═══ WebSocket(雙源) ═══
// OKX注意: K線頻道在 business 端點, tickers/trades 在 public 端點 → okx模式開兩條WS
let WSS=[],wsSeq=0,lastMsg=0,okxPing=null,TICK24=null;
function closeWS(){WSS.forEach(w=>{try{w.close();}catch(e){}});WSS=[];
  if(okxPing){clearInterval(okxPing);okxPing=null;}}
function connectWS(){
  const my=++wsSeq;
  closeWS();
  const tfs=[...new Set(PANELS.map(p=>p.tf))];
  const guard=(ws)=>{
    ws.onclose=()=>{if(my===wsSeq)setTimeout(()=>{if(my===wsSeq)connectWS();},2000);};
    ws.onerror=()=>{try{ws.close();}catch(e){}};
    WSS.push(ws);
  };
  if(SRC==='bn'){
    const s=SYM.s.toLowerCase();
    const streams=[s+'@aggTrade',s+'@ticker',...tfs.map(t=>s+'@kline_'+tfDef(t).iv)];
    const ws=new WebSocket('wss://fstream.binance.com/stream?streams='+streams.join('/'));
    ws.onmessage=(ev)=>{
      if(my!==wsSeq)return;
      lastMsg=Date.now();
      const m=JSON.parse(ev.data),st=m.stream,dd=m.data;
      if(st.endsWith('@aggTrade')){tickPx(+dd.p);}
      else if(st.endsWith('@ticker')){TICK24={c:+dd.c,P:+dd.P,h:+dd.h,l:+dd.l};header();}
      else if(st.indexOf('@kline_')>=0){
        const t=TFS.find(x=>x.iv===st.split('@kline_')[1]);if(!t)return;
        applyK(t.tf,dd.k);
        PANELS.forEach(p=>{if(p.tf===t.tf)queueDraw(p);});
      }
    };
    guard(ws);
  }else{
    const mkOkx=(url,args,handler)=>{
      const ws=new WebSocket(url);
      ws.onopen=()=>{if(my!==wsSeq)return;
        ws.send(JSON.stringify({op:'subscribe',args:args}));};
      ws.onmessage=(ev)=>{
        if(my!==wsSeq)return;
        lastMsg=Date.now();
        if(ev.data==='pong')return;
        let m;try{m=JSON.parse(ev.data);}catch(e){return;}
        if(m.event||!m.arg||!m.data)return;
        handler(m);
      };
      guard(ws);
    };
    mkOkx('wss://ws.okx.com:8443/ws/v5/public',
      [{channel:'tickers',instId:SYM.inst},{channel:'trades',instId:SYM.inst}],
      (m)=>{
        if(m.arg.channel==='trades'){tickPx(+m.data[0].px);}
        else{const t=m.data[0];
          TICK24={c:+t.last,P:+((+t.last-+t.open24h)/+t.open24h*100).toFixed(2),h:+t.high24h,l:+t.low24h};header();}
      });
    mkOkx('wss://ws.okx.com:8443/ws/v5/business',
      tfs.map(t=>({channel:'candle'+tfDef(t).ob,instId:SYM.inst})),
      (m)=>{
        const t=TFS.find(x=>'candle'+x.ob===m.arg.channel);if(!t)return;
        const b=m.data[0];
        applyK(t.tf,{t:+b[0],o:b[1],h:b[2],l:b[3],c:b[4],v:b[5]});
        tickPx(+b[4]);
        PANELS.forEach(p=>{if(p.tf===t.tf)queueDraw(p);});
      });
    okxPing=setInterval(()=>{WSS.forEach(w=>{try{w.send('ping');}catch(e){}});},20000);
  }
}
// 秒級跳動只改DOM數字, K棒重畫節流400ms
let lastPx=null;
function tickPx(p){
  const el=document.getElementById('px');
  el.textContent=fmt(p);
  if(lastPx!=null&&p!==lastPx)el.className='px '+(p>=lastPx?'up':'dn');
  lastPx=p;estCalc();
  // ═ 治本: 每筆成交價直接推動當前K棒, 不等K線頻道(K線頻道/REST只做事後校正) ═
  const now=Date.now()/1000;
  for(const tf of new Set(PANELS.map(x=>x.tf))){
    const d=CACHE[ckey(tf)];if(!d||!d.ts.length)continue;
    const t0=Math.floor(now/(tf*60))*(tf*60);
    const li=d.ts.length-1;
    if(d.ts[li]===t0){
      const b=d.ohlc[li];   // [開,收,低,高]
      if(p!==b[1]||p>b[3]||p<b[2]){
        b[1]=p;if(p>b[3])b[3]=p;if(p<b[2])b[2]=p;
        PANELS.forEach(pp=>{if(pp.tf===tf)queueDraw(pp);});
      }
    }else if(t0>d.ts[li]){
      d.ts.push(t0);d.labels.push(lbl(t0));d.ohlc.push([p,p,p,p]);d.vol.push(0);
      if(d.ts.length>2200){d.ts.shift();d.labels.shift();d.ohlc.shift();d.vol.shift();}
      PANELS.forEach(pp=>{if(pp.tf===tf)queueDraw(pp);});
    }
  }
}
const drawQ=new Set();let drawTimer=null;
function queueDraw(p){
  drawQ.add(p);
  if(drawTimer)return;
  drawTimer=setTimeout(()=>{drawTimer=null;
    const q=[...drawQ];drawQ.clear();q.forEach(draw);},400);
}
function header(){
  const el=i=>document.getElementById(i);
  if(TICK24){
    el('chg').textContent=(TICK24.P>=0?'+':'')+TICK24.P.toFixed(2)+'%';
    el('chg').className=TICK24.P>=0?'up':'dn';
    el('hi').textContent=fmt(TICK24.h);el('lo').textContent=fmt(TICK24.l);
  }
  const srcName=SRC==='bn'?'幣安':'OKX';
  const age=lastMsg?(Date.now()-lastMsg)/1000:9e9;
  const bAge=bkTick?(Date.now()-bkTick)/1000:9e9;
  const dot=el('dot');
  if(age<10){dot.className='ok';el('ts').textContent='即時·'+srcName;}
  else if(bAge<25){dot.className='bad';el('ts').textContent='REST備援·'+srcName;}
  else if(lastMsg||bkTick){dot.className='bad';el('ts').textContent='⚠斷線';}
  else el('ts').textContent='連線中…';
}

function parseJump(s){
  s=s.trim();const now=new Date();
  let m=s.match(/^(\d{2})(\d{2})(\d{2})(\d{2})$/);
  if(m){const d=new Date(now.getFullYear(),+m[1]-1,+m[2],+m[3],+m[4]);
    if(d-now>90*86400000)d.setFullYear(d.getFullYear()-1);return d.getTime()/1000;}
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[ ,]+(\d{1,2}):?(\d{2})$/);
  if(m){const d=new Date(now.getFullYear(),+m[1]-1,+m[2],+m[3],+m[4]);
    if(d-now>90*86400000)d.setFullYear(d.getFullYear()-1);return d.getTime()/1000;}
  m=s.match(/^(\d{1,2}):?(\d{2})$/);
  if(m)return new Date(now.getFullYear(),now.getMonth(),now.getDate(),+m[1],+m[2]).getTime()/1000;
  return null;
}

function doJump(){
  const inp=document.getElementById('jump');
  const t=parseJump(inp.value);
  if(t==null){inp.style.borderColor='#ef5350';setTimeout(()=>inp.style.borderColor='#2a3245',900);return;}
  PANELS.forEach(p=>{
    const d=CACHE[ckey(p.tf)];if(!d||!d.ts.length)return;
    const b=Math.floor(t/(p.tf*60))*(p.tf*60);
    let lo=0,hi=d.ts.length-1;
    while(lo<hi){const mid=(lo+hi)>>1;if(d.ts[mid]<b)lo=mid+1;else hi=mid;}
    let idx=lo;
    if(idx>0&&Math.abs(d.ts[idx-1]-b)<Math.abs(d.ts[idx]-b))idx--;
    const win=p.tf===1?120:80;
    p.win={size:win,right:false,endI:Math.min(d.ts.length-1,idx+(win>>1))};
    draw(p);
  });
  inp.blur();
}

function setupLongPress(p,div){
  let timer=null,sx=0,sy=0,pinch0=null,tipDrag=null;
  const HOLD=1000;
  const pos=(t)=>{const r=div.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top};};
  function tipEl(){
    if(!p._tip||!p._tip.isConnected){
      p._tip=[...p.chart.getDom().querySelectorAll('div')]
        .find(x=>x.style&&x.style.zIndex==='9999999')||null;
    }
    return p._tip;
  }
  function moveCross(x,y){
    p.lastCrossXY=[x,y];
    p.chart.dispatchAction({type:'showTip',x:x,y:y});
    const d=CACHE[ckey(p.tf)];if(!d)return;
    try{
      const c=p.chart.convertFromPixel({seriesIndex:0},[x,y]);
      const idx=Math.max(0,Math.min(d.ohlc.length-1,Math.round(c[0])));
      const cv=d.ohlc[idx][1];
      if(cv!==p.closeVal){p.closeVal=cv;
        p.chart.setOption({series:[{markLine:mkML(p,d)}]});}
    }catch(_){}
  }
  function setCross(on){
    p.cross=on;
    if(navigator.vibrate)try{navigator.vibrate(on?[40,60,40]:40);}catch(_){ }
    if(on){p.chart.setOption({dataZoom:[{disabled:true}]});}
    else{
      p.closeVal=null;p._tip=null;tipDrag=null;
      p.chart.dispatchAction({type:'hideTip'});
      p.chart.clear();draw(p);
    }
  }
  div.addEventListener('touchstart',e=>{
    const te=tipEl();
    if(p.cross&&te&&e.touches.length===1&&te.contains(e.target)){
      const q=pos(e.touches[0]);
      const br=te.getBoundingClientRect(),r=div.getBoundingClientRect();
      tipDrag={dx:q.x-(br.left-r.left),dy:q.y-(br.top-r.top)};
      clearTimeout(timer);
      return;
    }
    if(e.touches.length===1){
      const t=e.touches[0];sx=t.clientX;sy=t.clientY;pinch0=null;
      clearTimeout(timer);
      timer=setTimeout(()=>{
        const r=div.getBoundingClientRect();
        setCross(!p.cross);
        if(p.cross)moveCross(sx-r.left,sy-r.top);
      },HOLD);
      if(p.cross){const q=pos(t);moveCross(q.x,q.y);}
    }else{
      clearTimeout(timer);
      if(p.cross&&e.touches.length===2){
        const dx=e.touches[0].clientX-e.touches[1].clientX,
              dy=e.touches[0].clientY-e.touches[1].clientY;
        const d=CACHE[ckey(p.tf)],n=d?d.labels.length:0;
        const w=p.win||{size:(p.tf===1?240:120),right:true,endI:n-1};
        pinch0={d0:Math.hypot(dx,dy),size0:w.size,
                endI0:w.right?n-1:w.endI,right0:w.right};
      }
    }
  },{passive:true});
  div.addEventListener('touchmove',e=>{
    if(tipDrag&&e.touches.length===1){
      e.preventDefault();
      const q=pos(e.touches[0]);
      p.tipPos=[q.x-tipDrag.dx,q.y-tipDrag.dy];
      if(p.lastCrossXY)p.chart.dispatchAction({type:'showTip',x:p.lastCrossXY[0],y:p.lastCrossXY[1]});
      return;
    }
    if(e.touches.length===1){
      const t=e.touches[0];
      if(Math.abs(t.clientX-sx)>12||Math.abs(t.clientY-sy)>12)clearTimeout(timer);
      if(p.cross){e.preventDefault();const q=pos(t);moveCross(q.x,q.y);}
    }else if(p.cross&&pinch0&&e.touches.length===2){
      e.preventDefault();
      const dx=e.touches[0].clientX-e.touches[1].clientX,
            dy=e.touches[0].clientY-e.touches[1].clientY;
      const scale=Math.hypot(dx,dy)/pinch0.d0;
      const d=CACHE[ckey(p.tf)];if(!d)return;
      const n=d.labels.length;
      const size=Math.max(10,Math.min(n,Math.round(pinch0.size0/scale)));
      p.win={size:size,right:pinch0.right0,
             endI:pinch0.right0?n-1:Math.min(n-1,pinch0.endI0)};
      draw(p);
    }
  },{passive:false});
  const end=e=>{clearTimeout(timer);tipDrag=null;
    if(!e.touches||e.touches.length<2)pinch0=null;};
  div.addEventListener('touchend',end);
  div.addEventListener('touchcancel',end);
}

function sma(a,n){const r=Array(a.length).fill(null);if(!n||n<1)return r;
  let s=0;for(let i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];
    if(i>=n-1)r[i]=+(s/n).toFixed(SYM.dp+1);}return r;}
function mkML(p,d){
  const data=[];const n=d.ohlc.length;
  if(n){const o=d.ohlc[n-1],c=o[1],up=c>=o[0];
    data.push({yAxis:c,lineStyle:{type:'dashed',color:up?C.up:C.dn,width:1},
      label:{show:true,position:'end',distance:2,color:'#0b1320',
             backgroundColor:up?C.up:C.dn,padding:[1,3],borderRadius:2,
             fontSize:9,fontWeight:700,formatter:fmt(c)}});}
  if(p.cross&&p.closeVal!=null)
    data.push({yAxis:p.closeVal,lineStyle:{type:'dashed',color:'rgba(230,233,240,.7)',width:1},
      label:{show:true,position:'insideEndTop',color:'#e6e9f0',fontSize:9,formatter:fmt(p.closeVal)}});
  return {silent:true,symbol:'none',animation:false,data:data};
}
function draw(p){
  const d=CACHE[ckey(p.tf)];if(!d)return;
  const closes=d.ohlc.map(v=>v[1]);
  const n=d.labels.length, show=p.tf===1?240:120;
  let startI,endI;
  if(p.win){endI=p.win.right?n-1:Math.min(p.win.endI,n-1);
    startI=Math.max(0,endI-p.win.size+1);}
  else{endI=n-1;startI=Math.max(0,n-show);}
  const maSeries=p.ma.map((m,j)=>({name:m?('MA'+m):('ma'+j+'off'),type:'line',
    data:m?sma(closes,m):[],connectNulls:false,symbol:'none',
    lineStyle:{width:1.4,color:MACOLOR[j]},itemStyle:{color:MACOLOR[j]},
    emphasis:{disabled:true}}));
  const opt={
    animation:false,backgroundColor:'transparent',
    tooltip:{trigger:'axis',triggerOn:TOUCH?'none':'mousemove|click',
      axisPointer:{type:'cross'},backgroundColor:'rgba(28,34,48,.92)',borderColor:'#333',
      textStyle:{color:C.ink,fontSize:9,lineHeight:12},confine:!TOUCH,padding:[2,5],
      enterable:true,transitionDuration:0,
      position:TOUCH?function(){return p.tipPos||[8,20];}:undefined,
      formatter:(ps)=>{let out='<b>'+(ps[0]?ps[0].axisValue:'')+'</b><br>';
        let mas=[];
        for(const q of ps){if(q.seriesType==='candlestick'){const v=q.value;
            out+='開'+fmt(v[1])+' 收'+fmt(v[2])+'<br>低'+fmt(v[3])+' 高'+fmt(v[4])+'<br>';}
          else if(q.seriesName==='量'){out+='量'+q.value+'<br>';}
          else if(q.value!=null&&q.seriesName.indexOf('off')<0){mas.push('<span style="color:'+q.color+'">'+q.seriesName.replace('MA','M')+'</span>'+fmt(q.value));}}
        if(mas.length)out+=mas.join(' ');
        return out;}},
    axisPointer:{link:[{xAxisIndex:'all'}]},
    legend:{top:0,right:8,textStyle:{color:C.ink2,fontSize:11},itemWidth:14,
      data:maSeries.filter((s,j)=>p.ma[j]).map(s=>s.name)},
    grid:[{left:10,right:66,top:22,bottom:(p.volh+13)+'%'},
          {left:10,right:66,bottom:'7%',height:p.volh+'%'}],
    xAxis:[{type:'category',data:d.labels,gridIndex:0,axisLine:{lineStyle:{color:'#2a3245'}},
            axisLabel:{color:C.ink2,fontSize:10},axisTick:{show:false}},
           {type:'category',data:d.labels,gridIndex:1,axisLabel:{show:false},axisTick:{show:false},
            axisLine:{lineStyle:{color:'#2a3245'}}}],
    yAxis:[{scale:true,gridIndex:0,position:'right',splitLine:{lineStyle:{color:'#1e2534'}},
            axisLabel:{color:C.ink2,fontSize:10,formatter:v=>fmt(v)}},
           {gridIndex:1,position:'right',splitLine:{show:false},axisLabel:{show:false}}],
    dataZoom:[{type:'inside',xAxisIndex:[0,1],startValue:startI,endValue:endI,
               throttle:40,zoomOnMouseWheel:true,moveOnMouseMove:true},
              {type:'slider',xAxisIndex:[0,1],bottom:2,height:12,borderColor:'#2a3245',
               backgroundColor:'#1c2230',fillerColor:'rgba(43,176,237,.15)',
               textStyle:{color:C.ink2,fontSize:10},startValue:startI,endValue:endI}],
    series:[
      {name:(p.tf===60?'1時':p.tf+'分')+'K',type:'candlestick',data:d.ohlc,
       markLine:mkML(p,d),
       itemStyle:{color:C.up,color0:C.dn,borderColor:C.up,borderColor0:C.dn}},

         return (o&&o[1]>=o[0])?'rgba(239,83,80,.45)':'rgba(38,166,154,.45)';}}}
    ]};
  p.chart.setOption(opt,{replaceMerge:['series','legend']});
}

// ═ OKX簽名請求 (WebCrypto HMAC-SHA256→base64) ═
async function okxApi(method,path,body){
  if(!CREDS)throw new Error('未設定金鑰');
  const ts=new Date().toISOString();
  const bodyStr=body?JSON.stringify(body):'';
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(CREDS.s),
    {name:'HMAC',hash:'SHA-256'},false,['sign']);
  const sigBuf=await crypto.subtle.sign('HMAC',key,enc.encode(ts+method+path+bodyStr));
  const sig=btoa(String.fromCharCode(...new Uint8Array(sigBuf)));
  const r=await fetch(OKX+path,{method:method,
    headers:{'OK-ACCESS-KEY':CREDS.k,'OK-ACCESS-SIGN':sig,'OK-ACCESS-TIMESTAMP':ts,
             'OK-ACCESS-PASSPHRASE':CREDS.p,'Content-Type':'application/json'},
    body:body?bodyStr:undefined});
  const j=await r.json();
  if(j.code!=='0'){
    const sub=(j.data&&j.data[0]&&j.data[0].sMsg)?j.data[0].sMsg:'';
    throw new Error((j.msg||('code '+j.code))+(sub?(' | '+sub):''));
  }
  return j.data;
}
// 合約規格(公開)
async function loadSpecs(){
  for(const sy of SYMS){
    try{
      const r=await fetch(OKX+'/api/v5/public/instruments?instType=SWAP&instId='+sy.inst);
      const j=await r.json();
      if(j.code==='0'&&j.data.length){const d=j.data[0];
        SPEC[sy.inst]={ctVal:+d.ctVal,minSz:+d.minSz,lotSz:+d.lotSz,lever:+d.lever,
                       lotDec:(d.lotSz.split('.')[1]||'').length};}
    }catch(e){}
  }
  ordSymSync();
}
function ordSymSync(){
  $('fTitle').innerHTML=SYM.inst.replace('-SWAP','')+'<small>OKX永續·市價</small>';
  const sp=SPEC[SYM.inst];
  if(sp){$('lev').max=sp.lever;
    if(+$('lev').value>sp.lever)$('lev').value=sp.lever;
    $('levLab').textContent='槓桿（上限'+sp.lever+'x）';}
  renderPos();estCalc();
}
let ACCTERR='';
async function refreshAcct(){
  if(!CREDS)return;
  try{
    const bal=await okxApi('GET','/api/v5/account/balance?ccy=USDT',null);
    const det=bal[0].details;
    AVAIL=det&&det.length?+det[0].availBal:0;
    ACCTERR='';
  }catch(e){ACCTERR=e.message||'連線失敗';}
  try{
    const ps=await okxApi('GET','/api/v5/account/positions?instType=SWAP',null);
    POSMAP={};
    for(const p of ps){if(+p.pos!==0)POSMAP[p.instId]=p;}
  }catch(e){}
  renderPos();estCalc();
}
function initAcct(){
  refreshAcct();
  if(acctTimer)clearInterval(acctTimer);
  acctTimer=setInterval(refreshAcct,8000);
}
function renderPos(){
  const p=POSMAP[SYM.inst];
  const others=Object.keys(POSMAP).filter(k=>k!==SYM.inst).length;
  if(!p){$('posRow').classList.toggle('on',others>0);
    $('posTxt').textContent=others?('另有'+others+'筆其他幣持倉'):'';
    $('posTxt').style.color='var(--ink2)';$('posPnl').textContent='';$('posSub').textContent='';
    $('flatBtn').style.display='none';return;}
  const sz=+p.pos,long=sz>0;
  $('posRow').classList.add('on');$('flatBtn').style.display='';
  // 董事長紀律: 不顯示浮動損益, 沒平倉不算獲利。只留方向+張數+進場價+強平價
  $('posTxt').textContent=(long?'多 ':'空 ')+Math.abs(sz)+'張 @'+(+p.avgPx).toLocaleString();
  $('posTxt').style.color=long?'var(--up)':'var(--dn)';
  $('posPnl').textContent='';
  $('posSub').textContent=p.lever+'x'+(p.liqPx?(' 強平'+(+p.liqPx).toLocaleString()):'')
    +(others?(' · 另有'+others+'筆他幣倉'):'');
}
function setSide(s){SIDE=s;
  $('oLong').className=s==='long'?'on-long':'';$('oShort').className=s==='short'?'on-short':'';
  $('sendBtn').className='send '+(s==='long'?'long':'short');
  $('sendBtn').textContent=s==='long'?'市價買入':'市價賣出';estCalc();}
$('oLong').onclick=()=>setSide('long');$('oShort').onclick=()=>setSide('short');
function calcOrder(){
  const sp=SPEC[SYM.inst];
  if(!sp||!lastPx)return null;
  const lev=+$('lev').value,pct=+$('pct').value;
  const notional=AVAIL*lev*pct/100;
  const rawCt=notional/lastPx/sp.ctVal;
  const ct=Math.floor(rawCt/sp.lotSz)*sp.lotSz;
  const szStr=ct.toFixed(sp.lotDec);
  return {lev:lev,pct:pct,notional:+szStr*sp.ctVal*lastPx,coins:+szStr*sp.ctVal,
          sz:szStr,ok:+szStr>=sp.minSz};
}
function estCalc(){
  if($('tradeBody').hidden)return;
  const lev=+$('lev').value,pct=+$('pct').value;
  $('levV').textContent=lev+'x';$('pctV').textContent=pct+'%';
  $('estAvail').textContent=AVAIL?AVAIL.toFixed(1)+'U':'--';
  const o=calcOrder();
  if(!o){$('estNot').textContent='--';$('estCoin').textContent='--';$('estMar').textContent='--';return;}
  $('estNot').textContent=Math.round(o.notional).toLocaleString()+'U';
  $('estCoin').textContent=o.coins.toFixed(4)+' '+SYM.n+'（'+o.sz+'張）';
  $('estMar').textContent=(o.notional/o.lev).toFixed(1)+'U';
  const w=$('ordWarn');
  if(!CREDS){w.textContent='先按⚙設定金鑰';w.hidden=false;}
  else if(ACCTERR){w.textContent='金鑰驗證失敗：'+ACCTERR+'（按⚙重新輸入）';w.hidden=false;}
  else if(!AVAIL){w.textContent='交易帳戶沒有可用USDT（去OKX劃轉）';w.hidden=false;}
  else if(!o.ok){w.textContent='數量不足最小單位，拉大倉位%';w.hidden=false;}
  else w.hidden=true;
}
$('lev').oninput=estCalc;$('pct').oninput=estCalc;
function crow(k,v){return '<div class="crow"><span class="k">'+k+'</span><span>'+v+'</span></div>';}
$('sendBtn').onclick=()=>{
  if(!CREDS){showSet(true);return;}
  const o=calcOrder();
  if(!o){toast('行情尚未就緒','err');return;}
  if(!o.ok){toast('數量不足最小單位（拉大倉位%）','err');return;}
  if(!AVAIL){toast('交易帳戶沒有USDT','err');return;}
  pend={kind:'open',side:SIDE,o:o};
  $('cTitle').textContent='確認市價下單';
  $('cRows').innerHTML=
    crow('合約',SYM.inst)+
    crow('方向',SIDE==='long'?'<b style="color:var(--up)">買入做多</b>':'<b style="color:var(--dn)">賣出做空</b>')+
    crow('數量',o.sz+'張 ≈ '+o.coins.toFixed(4)+' '+SYM.n)+
    crow('名目 / 保證金',Math.round(o.notional).toLocaleString()+'U / '+(o.notional/o.lev).toFixed(1)+'U')+
    crow('槓桿 / 模式',o.lev+'x / 全倉');
  $('okBtn').className='okbtn '+(SIDE==='long'?'long':'short');
  $('okBtn').textContent='確認送出';
  $('confirm').classList.add('open');
};
$('flatBtn').onclick=()=>{
  const p=POSMAP[SYM.inst];if(!p)return;
  pend={kind:'close'};
  $('cTitle').textContent='確認市價平倉';
  $('cRows').innerHTML=crow('合約',SYM.inst)+
    crow('動作','<b>市價全平</b> '+((+p.pos>0)?'多單':'空單')+' '+Math.abs(+p.pos)+'張')+
    crow('進場價',(+p.avgPx).toLocaleString());
  $('okBtn').className='okbtn flatc';
  $('okBtn').textContent='確認平倉';
  $('confirm').classList.add('open');
};
$('cCancel').onclick=()=>$('confirm').classList.remove('open');
$('okBtn').onclick=async()=>{
  $('okBtn').disabled=true;
  try{
    if(pend.kind==='open'){
      try{await okxApi('POST','/api/v5/account/set-leverage',
        {instId:SYM.inst,lever:String(pend.o.lev),mgnMode:'cross'});}catch(e){}
      const d=await okxApi('POST','/api/v5/trade/order',
        {instId:SYM.inst,tdMode:'cross',side:pend.side==='long'?'buy':'sell',
         ordType:'market',sz:pend.o.sz});
      toast('✓ 已成交送出 單號'+(d[0].ordId||'').slice(-6));
    }else{
      await okxApi('POST','/api/v5/trade/close-position',{instId:SYM.inst,mgnMode:'cross'});
      toast('✓ 已市價平倉');
    }
    $('confirm').classList.remove('open');
    setTimeout(refreshAcct,800);
  }catch(e){
    toast('✗ '+e.message,'err');
  }
  $('okBtn').disabled=false;
};
let toastT=null;
function toast(t,cls){const el=$('toast');el.textContent=t;el.className='toast '+(cls||'');
  el.style.display='block';clearTimeout(toastT);
  toastT=setTimeout(()=>el.style.display='none',3000);}

// ═ 啟動 ═
reloadAll();
loadSpecs();
if(CREDS)initAcct();
</script></body></html>
